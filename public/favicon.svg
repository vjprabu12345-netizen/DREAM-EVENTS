<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B5A" />
      <stop offset="100%" stop-color="#120524" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#purpleBg)" />
  <rect width="60" height="60" x="2" y="2" rx="14" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Crown graphic -->
  <g filter="url(#glow)">
    <path d="M14 44L18 24L26 34L32 18L38 34L46 24L50 44H14Z" fill="url(#goldGrad)" />
    <!-- Jewels / spheres -->
    <circle cx="18" cy="22" r="2.5" fill="#FFF" />
    <circle cx="32" cy="16" r="3" fill="#FFF" />
    <circle cx="46" cy="22" r="2.5" fill="#FFF" />
    <circle cx="26" cy="33" r="1.5" fill="#E91E63" />
    <circle cx="38" cy="33" r="1.5" fill="#00E5FF" />
    <!-- Base band -->
    <rect x="14" y="44" width="36" height="5" rx="2.5" fill="url(#goldGrad)" />
  </g>
</svg>